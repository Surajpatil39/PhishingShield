<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishingShield Warning</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a0f0f 0%, #2a1313 45%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(239, 68, 68, 0.28);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .icon {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
      color: white;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 14px 36px rgba(239, 68, 68, 0.35);
    }

    .headerText h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    .headerText p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 15px;
    }

    .content {
      padding: 24px 28px 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 16px;
    }

    .label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
    }

    .block {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
    }

    .block h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #urlValue {
      color: #fca5a5;
      word-break: break-word;
      line-height: 1.6;
    }

    #reasonList {
      margin: 0;
      padding-left: 20px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    #reasonList li {
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    #goBackBtn {
      background: #22c55e;
      color: #052e16;
    }

    #continueBtn {
      background: #ef4444;
      color: white;
    }

    .footerNote {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .icon {
        width: 64px;
        height: 64px;
        font-size: 36px;
      }

      .headerText h1 {
        font-size: 24px;
      }

      .value {
        font-size: 24px;
      }

      .content,
      .header {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div class="icon">!</div>
      <div class="headerText">
        <h1 id="warningTitle">Potential phishing warning</h1>
        <p>
          This page was blocked because the URL pattern looks suspicious and may be unsafe.
        </p>
      </div>
    </section>

    <section class="content">
      <div class="stats">
        <div class="card">
          <span class="label">Risk Score</span>
          <div class="value" id="riskValue">--%</div>
        </div>

        <div class="card">
          <span class="label">Verdict</span>
          <div class="value" id="verdictValue">--</div>
        </div>
      </div>

      <div class="block">
        <h3>Blocked URL</h3>
        <div id="urlValue">Loading...</div>
      </div>

      <div class="block">
        <h3>Why it was flagged</h3>
        <ul id="reasonList">
          <li>Loading analysis...</li>
        </ul>
      </div>

      <div class="actions">
        <button id="goBackBtn">Go Back to Safety</button>
        <button id="continueBtn">Continue Anyway</button>
      </div>

      <div class="footerNote">
        Continue only if you are completely sure that this site is legitimate.
      </div>
    </section>
  </main>

  <script src="warning.js"></script>
</body>
</html>
